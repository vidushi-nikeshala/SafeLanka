<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | SafeLanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: #0b1629;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #001a33 0%, #050505 100%);
            text-align: center;
        }

        .main-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 50px 30px;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .big-icon {
            font-size: 4rem;
            color: #e63946;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Roboto Mono', monospace;
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .go-btn {
            background: #e63946;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .go-btn:hover { 
            background: #c92a37; 
        }
    </style>
</head>
<body>
    <div id="google_translate_element" style="display: none;"></div>

    <div class="main-box">
        <i class="fa-solid fa-wifi-slash big-icon"></i>
        
        <h1>No Connection</h1>
        
        <p>
            You are currently offline. SafeLanka needs an internet connection 
            to send reports and check who you are.
        </p>
        
        <button class="go-btn" onclick="window.location.reload()">
            Try Again
        </button>
    </div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en', 
                includedLanguages: 'en,si,ta', 
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function setLanguage(langCode) {
            document.cookie = "googtrans=/en/" + langCode + "; path=/";
            location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            let currentLang = 'en';
            let myCookies = document.cookie;

            if (myCookies.includes('googtrans=/en/si')) {
                currentLang = 'si';
            }
            if (myCookies.includes('googtrans=/en/ta')) {
                currentLang = 'ta';
            }
            
            let words = { 
                en: 'Language', 
                si: 'සිංහල', 
                ta: 'தமிழ்' 
            };
            
            let myLabel = document.getElementById('lang-label');
            if(myLabel) {
                myLabel.innerText = words[currentLang];
            }
        });
    </script>
</body>
</html>
